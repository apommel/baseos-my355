# RTL8733BU WiFi, zlyme's options. rtw_ips_mode=0 is required: the driver's
# idle power-down also takes Bluetooth's firmware, which shares the chip.
# Power save stays off; rtw_power_mgnt=2 timed out HTTPS on some hotspots.
options 8733bu rtw_ips_mode=0 rtw_power_mgnt=0 rtw_lps_level=0 rtw_lps_chk_by_tp=1 rtw_enusbss=0
