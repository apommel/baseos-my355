# BaseOS settings. Edit this file on the BaseOS card, then restart to apply.
# Hostname: 1-63 ASCII letters, digits or hyphens; no leading/trailing hyphen.
# Defaults to miyoo-flip.
# hostname=miyoo-flip
# Publish <hostname>.local on Wi-Fi: true or false.
# mdns=true

# SSH password (plain text). Defaults to root. See the settings reference:
# https://github.com/apommel/baseos-my355/blob/main/INSTALL.md#settings
# ssh_password=your-password
