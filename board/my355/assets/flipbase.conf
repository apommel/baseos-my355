# FlipBase settings. Edit this file on the FlipBase card, then restart to apply.
# Hostname: 1-63 ASCII letters, digits or hyphens; no leading/trailing hyphen.
# Defaults to miyoo-flip.
# hostname=miyoo-flip

# SSH password (plain text). Defaults to root. See the settings reference:
# https://github.com/apommel/baseos-my355/blob/main/INSTALL.md#settings
# ssh_password=your-password

# GPU driver: panfrost (Mesa, the default) or mali (Rockchip's libmali).
# gpu=panfrost

# Keyboard input: on also types each gamepad button as stock's keyboard key,
# for apps that read no gamepad. Apps reading both see each press twice.
# keyboard_input=off
