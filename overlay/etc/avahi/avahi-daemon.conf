# BaseOS mDNS: publish the WiFi <hostname>.local IPv4 and reverse records.
# No static service definitions are shipped and D-Bus is not compiled in.
# Disable the optional host-related records below as well.
#
# host-name is intentionally unset: baseos-config sets the kernel hostname
# before the frontend can obtain a lease and start the responder.
[server]
use-ipv4=yes
use-ipv6=no
allow-interfaces=wlan0
# WiFi disconnect may leave the interface up with its old lease assigned.
use-iff-running=yes
domain-name=local
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=no

[reflector]
enable-reflector=no

[publish]
disable-publishing=no
publish-hinfo=no
publish-addresses=yes
publish-aaaa-on-ipv4=no
publish-workstation=no
publish-domain=no
publish-resolv-conf-dns-servers=no
