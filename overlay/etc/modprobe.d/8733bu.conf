# RTL8733BU WiFi. rtw_ips_mode=0 is required: the driver's idle power-down
# also takes Bluetooth's firmware, which shares the chip. Station power save
# as on stock (LPS MAX, level 0): ~350 mW less than off in game.
options 8733bu rtw_ips_mode=0 rtw_power_mgnt=2 rtw_lps_level=0 rtw_lps_chk_by_tp=1 rtw_enusbss=0
